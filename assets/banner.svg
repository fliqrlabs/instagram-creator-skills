<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Instagram Creator Skills by Fliqr AI: from viral hook to live comment-to-DM funnel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14092E"/>
      <stop offset="1" stop-color="#2A1170"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C3BFF"/>
      <stop offset="1" stop-color="#FF4FA3"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="24"/></clipPath>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="1150" cy="70" r="180" fill="#6C3BFF" opacity="0.18"/>
    <circle cx="1040" cy="380" r="120" fill="#FF4FA3" opacity="0.12"/>
  </g>
  <text x="72" y="110" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#B9A6FF" letter-spacing="4">FLIQR AI · INSTAGRAM CREATOR SKILLS FOR CLAUDE</text>
  <text x="72" y="190" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF">Your reel went viral.</text>
  <text x="72" y="265" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#accent)">Now make it pay you.</text>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">
    <rect x="72" y="315" width="120" height="44" rx="22" fill="#6C3BFF" opacity="0.35"/>
    <text x="132" y="344" text-anchor="middle">Hook</text>
    <text x="210" y="344" fill="#B9A6FF">→</text>
    <rect x="236" y="315" width="120" height="44" rx="22" fill="#6C3BFF" opacity="0.35"/>
    <text x="296" y="344" text-anchor="middle">Script</text>
    <text x="374" y="344" fill="#B9A6FF">→</text>
    <rect x="400" y="315" width="130" height="44" rx="22" fill="#6C3BFF" opacity="0.35"/>
    <text x="465" y="344" text-anchor="middle">Caption</text>
    <text x="548" y="344" fill="#B9A6FF">→</text>
    <rect x="574" y="315" width="210" height="44" rx="22" fill="url(#accent)"/>
    <text x="679" y="344" text-anchor="middle">Comment → DM</text>
    <text x="802" y="344" fill="#B9A6FF">→</text>
    <rect x="828" y="315" width="120" height="44" rx="22" fill="#6C3BFF" opacity="0.35"/>
    <text x="888" y="344" text-anchor="middle">Leads</text>
